; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
monitor_speed = 115200
board_build.core = earlephilhower

; NOTE: 0x1209/0x0001 is pid.codes' shared TEST PID.
; Fine for private bring-up only — do not ship/distribute with this ID.
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0x0001
; board_build.arduino.earlephilhower.usb_vid = 0x256F
; board_build.arduino.earlephilhower.usb_pid = 0xC635
board_build.arduino.earlephilhower.usb_manufacturer = "abhay"
board_build.arduino.earlephilhower.usb_product = "3DSpaceMouse"

build_flags =
    -DUSE_TINYUSB

lib_deps =
    adafruit/Adafruit MLX90393
    adafruit/Adafruit BusIO